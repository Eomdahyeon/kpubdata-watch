name: 버그 리포트
description: 예상과 다르게 동작하는 문제를 신고합니다
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        버그를 신고해 주셔서 감사합니다. 재현에 필요한 정보를 최대한 채워주세요.
        API key 나 token 은 붙여 넣지 마세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 무엇이 잘못되었나요?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 문제를 재현하는 명령·요청 또는 단계별 절차
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 / 오류 로그(traceback)
      render: shell
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: 관련 Dataset (해당 시)
      placeholder: "예) visitkorea-tourism"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, Python 버전, kpubdata-watch 버전
    validations:
      required: false
  - type: dropdown
    id: verification
    attributes:
      label: Required Verification (POLICY 18)
      description: |
        이 버그가 고쳐졌다고 판단하려면 어떤 수준의 기계 검증이 필요한가요?
        kpubdata POLICY 18 의 V0~V5 중 하나를 고릅니다. 잘 모르겠으면 V1 로 두면
        triage 가 정합니다.
      options:
        - V0 — Static (lint, typecheck, schema validation)
        - V1 — Unit (unit tests)
        - V2 — Replay / Contract (fixture-based contract tests)
        - V3 — Component Integration
        - V4 — Live Provider (real provider API calls)
        - V5-replay — Product E2E (replay)
        - V5-live — Product E2E (live)
    validations:
      required: true
