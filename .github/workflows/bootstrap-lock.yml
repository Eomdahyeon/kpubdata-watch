name: Bootstrap lock

# One-off: writes uv.lock onto a branch, because the machine that set this repository up
# could not reach PyPI's file host. Removed by the pull request that adds the lock.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to lock and push to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - uses: astral-sh/setup-uv@v7
      - name: Lock and push
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: lock dependencies with uv"
          git push origin "HEAD:${BRANCH}"
