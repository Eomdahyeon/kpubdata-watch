name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Comments and docstrings are English (kpubdata ADR 0003); the gate is the
      # series' own script, copied.
      - name: Korean comment gate
        run: uv run python scripts/check_english_comments.py src tests scripts

      - name: Mypy
        run: uv run mypy src

      # README.md and README.en.md keep the same sections, as in kpubdata (#546 there).
      - name: README parity
        run: uv run python scripts/check_readme_parity.py

      # PRD D-016: Watch depends on KPubData only, never on Builder or Studio.
      - name: Independence (no Builder or Studio dependency)
        run: uv run python scripts/check_independence.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Live tests need real credentials and never run in PR CI (docs/TESTING.md);
      # pyproject's addopts deselects them.
      - name: Run tests
        run: uv run pytest -ra

  coverage:
    # One job measures coverage; the floor lives in pyproject's [tool.coverage.report].
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: uv run pytest -ra --cov --cov-report=term-missing

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  base-install:
    # Every other job installs the dev extra; this one proves the declared runtime
    # dependencies alone are enough to import the package and run its CLI.
    name: Base install (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with no extras
        run: pip install .

      - name: The package imports and the CLI runs
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import kpubdata_watch; print(kpubdata_watch.__version__)"
          kpubdata-watch --version

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install mkdocs-material pymdown-extensions

      - name: Build docs (strict)
        run: mkdocs build --strict

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      # sha256 of gitleaks_8.28.0_linux_x64.tar.gz, the same pin kpubdata uses.
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # history, not just the tip: a key removed later is still leaked

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" gitleaks

      - name: Scan the full history
        run: ./gitleaks git . --redact --no-banner --log-level info

  # One gate, so that editing the matrix is not also editing branch protection. GitHub
  # does not treat an absent required check as a failure — it waits, and every pull
  # request stays BLOCKED. Branch protection requires this job and nothing else.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, build, base-install, docs, secret-scan]
    # `always()` so a failed job still reaches this step; a skipped required check is
    # the same absence this job exists to remove.
    if: always()
    steps:
      - name: Every job this gate covers must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::CI gate failed — upstream results were: ${results}"
              exit 1
            fi
          done
          echo "every upstream job succeeded"
