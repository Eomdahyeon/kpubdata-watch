name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Comments and docstrings are English (kpubdata ADR 0003); the gate is the
      # series' own script, copied.
      - name: Korean comment gate
        run: uv run python scripts/check_english_comments.py src tests scripts

      - name: Mypy
        run: uv run mypy src

      # README.md and README.en.md keep the same sections, as in kpubdata (#546 there).
      - name: README parity
        run: uv run python scripts/check_readme_parity.py

      # PRD D-016: Watch depends on KPubData only, never on Builder or Studio.
      - name: Independence (no Builder or Studio dependency)
        run: uv run python scripts/check_independence.py

      # #72: brand-v2.css must match Studio's real token source, so read Studio's
      # src/globals.css from its main branch. This is a text comparison of a checked-out
      # file, not a package dependency or an import, which is all check_independence.py
      # (PRD D-016) forbids.
      - name: Check out KPubData Studio tokens
        uses: actions/checkout@v7
        with:
          repository: kpubdata-lab/kpubdata-studio
          ref: main
          path: .studio
          sparse-checkout: |
            src/globals.css
            assets/logo/kpubdata-brand-assets/svg/symbol_light.svg
            assets/logo/kpubdata-brand-assets/svg/favicon.svg
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Brand v2 tokens match Studio
        run: uv run python scripts/check_brand_tokens.py --studio .studio/src/globals.css

      # #71: the K symbol and favicon are Studio's approved files, unchanged.
      - name: Brand symbol matches Studio
        run: |
          studio=.studio/assets/logo/kpubdata-brand-assets/svg
          static=src/kpubdata_watch/web/static
          cmp "$studio/symbol_light.svg" "$static/kpubdata-symbol.svg"
          cmp "$studio/favicon.svg" "$static/favicon.svg"

      # #3: issue templates keep asking for a Required Verification level, and the
      # PR title gate in titles.yml stays wired.
      - name: Governance gates stay wired
        run: uv run python scripts/check_governance.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Live tests need real credentials and never run in PR CI (docs/TESTING.md);
      # pyproject's addopts deselects them.
      - name: Run tests
        run: uv run pytest -ra

  coverage:
    # One job measures coverage; the floor lives in pyproject's [tool.coverage.report].
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: uv run pytest -ra --cov --cov-report=term-missing

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  base-install:
    # Every other job installs the dev extra; this one proves the declared runtime
    # dependencies alone are enough to import the package and run its CLI.
    name: Base install (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with no extras
        run: pip install .

      - name: The package imports and the CLI runs
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import kpubdata_watch; print(kpubdata_watch.__version__)"
          kpubdata-watch --version

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install mkdocs-material pymdown-extensions

      - name: Build docs (strict)
        run: mkdocs build --strict

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      # sha256 of gitleaks_8.28.0_linux_x64.tar.gz, the same pin kpubdata uses.
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # history, not just the tip: a key removed later is still leaked

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" gitleaks

      # Without --log-opts, gitleaks runs `git log --all`, which walks every ref
      # fetch-depth: 0 pulled in — including unmerged PR branches that have nothing
      # to do with this run (kpubdata-studio#685). Scope it to the commits this run
      # is actually responsible for.
      - name: Scope the scan to this run's own commits
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              # Only this PR's commits, base..head, so an unrelated open PR can't
              # fail this one.
              log_opts="${BASE_SHA}..${HEAD_SHA}"
              ;;
            push)
              if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                # A new branch: no prior tip to diff against, so scan what the
                # branch brought in.
                log_opts="$PUSH_SHA"
              else
                log_opts="${BEFORE_SHA}..${PUSH_SHA}"
              fi
              ;;
            *)
              # schedule, workflow_dispatch: no run-specific range, so scan the
              # default branch's full history rather than every branch.
              log_opts="origin/${DEFAULT_BRANCH}"
              ;;
          esac
          echo "log-opts=${log_opts}" >> "$GITHUB_OUTPUT"

      - name: Scan the full history
        run: ./gitleaks git . --redact --no-banner --log-level info --log-opts="${{ steps.scope.outputs.log-opts }}"

  # One gate, so that editing the matrix is not also editing branch protection. GitHub
  # does not treat an absent required check as a failure — it waits, and every pull
  # request stays BLOCKED. Branch protection requires this job and nothing else.
  surface:
    name: Product surface (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # #89: what HTML parsing cannot check (sideways scroll at 390px, reduced motion)
      # is checked in a real Chromium. Playwright is added for this job only (`--with`),
      # not to the project's dependencies.
      - name: Install Chromium
        run: uv run --with "playwright>=1.48,<2" playwright install --with-deps chromium

      - name: Build the demo
        run: uv run python scripts/build_demo.py --output _site

      - name: The browser checks catch a deliberate violation
        run: uv run --with "playwright>=1.48,<2" python scripts/check_product_surface.py --self-test

      - name: Every page passes the browser checks
        run: uv run --with "playwright>=1.48,<2" python scripts/check_product_surface.py _site

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, build, base-install, docs, secret-scan, surface]
    # `always()` so a failed job still reaches this step; a skipped required check is
    # the same absence this job exists to remove.
    if: always()
    steps:
      - name: Every job this gate covers must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::CI gate failed — upstream results were: ${results}"
              exit 1
            fi
          done
          echo "every upstream job succeeded"
