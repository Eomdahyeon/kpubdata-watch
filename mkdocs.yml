site_name: KPubData Watch
site_url: "https://kpubdata-lab.github.io/kpubdata-watch/docs/"
site_description: 한국 공공데이터 신뢰성 관측
repo_url: https://github.com/kpubdata-lab/kpubdata-watch
repo_name: kpubdata-lab/kpubdata-watch

theme:
  name: material
  language: ko
  # Brand v2 (#68, docs/VISUAL_IDENTITY.md section 7): light is canonical with a white
  # header; dark is the alternative. `blue` is Material's nearest named accent and
  # stylesheets/brand.css pins the accent, the links and the dark header to Studio's values.
  # The KPubData symbol, byte-identical to the demo's (#71, tests/unit/test_brand_assets.py).
  logo: assets/kpubdata-symbol.svg
  favicon: assets/kpubdata-symbol.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/brand.css

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - 홈: index.md
  - 제품:
      - PRD: PRD.md
      - 로드맵: ROADMAP.md
  - 설계:
      - 도메인 모델: DOMAIN_MODEL.md
      - Detectors:
          - 개요: detectors/README.md
          - Availability: detectors/availability.md
          - Freshness: detectors/freshness.md
          - Contract: detectors/contract.md
          - Quality: detectors/quality.md
      - 아키텍처: architecture/README.md
      - Registry: REGISTRY.md
      - UI: UI.md
      - 시각 정체성: VISUAL_IDENTITY.md
      - 테스트: TESTING.md
  - 결정 기록:
      - 목록: decisions/README.md
      - "0001 MVP 범위": decisions/0001-mvp-scope-public-status.md
      - "0002 Health 와 Check": decisions/0002-one-health-many-checks.md
      - "0003 설명 가능한 탐지": decisions/0003-explainable-rule-based-detection.md
      - "0004 KPubData 에만 의존": decisions/0004-depend-on-kpubdata-only.md
      - "0005 UI Lab": decisions/0005-ui-lab-and-single-repository.md
      - "0006 Raw 응답 저장": decisions/0006-raw-response-storage.md
      - "0007 Rate Limit 과 이용조건": decisions/0007-registry-declares-provider-rate-limits-and-terms.md
      - "0008 Breaking Contract 기본 Severity": decisions/0008-breaking-contract-default-severity.md
      - "0009 확인 횟수": decisions/0009-confirmation-counts-global-default.md
      - "0010 공개 History 기간": decisions/0010-public-history-default-period.md
      - "0011 공지 엔티티": decisions/0011-notice-entity-manual-linking.md
      - "0012 Pages 데모": decisions/0012-pages-hosts-a-fixture-demo-not-the-service.md
      - "0013 Overview 와 History": decisions/0013-overview-now-and-history-views.md
      - "0014 Brand v2 시각 정체성": decisions/0014-brand-v2-visual-identity.md
