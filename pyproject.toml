[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpubdata-watch"
version = "0.1.0"
description = "Public data reliability watch for Korean public data APIs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Yeongseon Choe" }
]
keywords = [
  "korea",
  "public-data",
  "data-observability",
  "monitoring",
  "status-page",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# The reference stack from docs/ARCHITECTURE.md (PRD §32). Watch depends on KPubData
# and on nothing else in the family (PRD D-016, docs/decisions/0004).
dependencies = [
  "kpubdata>=0.8.0,<0.9",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "apscheduler>=3.10,<4",
  "jinja2>=3.1,<4",
]

[project.scripts]
kpubdata-watch = "kpubdata_watch.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]
docs = [
  "mkdocs-material>=9.5,<10",
  "pymdown-extensions>=10,<13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kpubdata_watch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Ruff formats Python blocks inside Markdown. The design documents quote the PRD
# verbatim, including the grouping inside its examples, so they are left as written.
exclude = ["docs/**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test scenarios are described in long strings; only the line length is relaxed.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

# Coverage gate, as in kpubdata (#456 there): the floor keeps what has been reached
# from slipping quietly. It lives here only, and one CI job enforces it.
[tool.coverage.run]
source = ["src/kpubdata_watch"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
addopts = "-ra -m 'not live'"
markers = ["live: real public API smoke tests (require credentials; never in PR CI)"]
testpaths = ["tests"]
